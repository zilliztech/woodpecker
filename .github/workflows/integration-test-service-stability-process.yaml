name: Service Stability (Process)

# Service stability suite, process tier: in-process nodes behind fault proxies,
# one pod replaced or killed at a time while a steady workload runs. The Docker
# and K8s tiers run the same cases against containers and a StatefulSet.

on:
  pull_request:
    branches:
      - master
      - dev
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "config/**"
      - ".github/workflows/integration-test-service-stability-process.yaml"
      - ".github/docker-compose-ci.yaml"
  workflow_call:

concurrency:
  group: integration-test-service-stability-process-${{ github.event_name == 'workflow_call' && 'nightly-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Service-Stability-Process:
    name: Service Stability (Process)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Start dependencies (etcd + MinIO)
        run: |
          # Pull before `up` so a registry hiccup can be retried on its own: a Docker Hub
          # timeout used to fail the job before a single test ran (#256). Bounded — three
          # attempts with backoff, then give up. Never retry indefinitely.
          for attempt in 1 2 3; do
            if docker compose -f .github/docker-compose-ci.yaml pull; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::docker compose pull failed after 3 attempts"
              exit 1
            fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker compose -f .github/docker-compose-ci.yaml up -d
          # Bounded health waits too. An unbounded `until` loop here would burn the whole
          # job timeout and surface as a cancelled job rather than a clear error.
          for svc in ci-etcd ci-minio; do
            echo "Waiting for $svc..."
            for i in $(seq 60); do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null)" = healthy ]; then break; fi
              if [ "$i" = 60 ]; then
                echo "::error::$svc did not become healthy within 120s"
                docker logs "$svc" 2>&1 | tail -50
                exit 1
              fi
              sleep 2
            done
            echo "$svc is ready"
          done

      - name: Create MinIO bucket
        run: |
          # mc comes from the MinIO image the stack already pulls, which ships it at
          # /usr/bin/mc. Neither of the two sources this step used before survived: the binary
          # download answers 410 (issue #330) and the standalone mc image is no longer public
          # (issue #376). Reusing the server image leaves one image to keep working instead of
          # two, and it is one we mirror ourselves.
          docker run --rm --network woodpecker-ci \
            -e MC_HOST_local=http://minioadmin:minioadmin@ci-minio:9000 \
            --entrypoint mc \
            milvusdb/minio:RELEASE.2024-12-18T13-15-44Z \
            mb local/a-bucket --ignore-existing

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run service stability tests (process tier)
        # No -race: these tests assert latency budgets, and the race detector's
        # slowdown would be measured as stalls.
        run: |
          set +e
          gotestsum --format pkgname-and-test-fails \
            --jsonfile test-output-service-stability-process.json \
            -- -cover -timeout=30m \
            -run "^TestServiceStabilityProcess" \
            ./tests/integration/...
          exit_code=$?
          echo ""
          echo "=== Test Results ==="
          jq -r 'select(.Test != null and .Elapsed != null) | select(.Action == "pass" or .Action == "fail") | (if .Action == "fail" then "FAIL" else "PASS" end) + " " + .Test + " (" + (.Elapsed | tostring) + "s)"' test-output-service-stability-process.json
          exit $exit_code

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-stability-process-logs
          path: test-output-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop dependencies
        if: always()
        run: |
          docker compose -f .github/docker-compose-ci.yaml down -v
