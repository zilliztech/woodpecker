name: Unit Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/wpdiag/**"
      - "diagnostics/**"
      - "Makefile"
      - ".github/workflows/unit-test.yaml"
  pull_request:
    branches:
      - master
      - dev
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/wpdiag/**"
      - "diagnostics/**"
      - "Makefile"
      - ".github/workflows/unit-test.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run unit tests
        run: |
          go test -race -short -cover -coverprofile=coverage.out -covermode=atomic -failfast -timeout=20m \
            $(go list ./... | grep -v -E '(tests/)')

      - name: Run standalone diagnostic smoke test
        run: |
          make wpcli wpdiag
          python3 cmd/wpdiag/tests/smoke.py

      # Use the same Prometheus build as the Helm example, isolated from the
      # operator's cluster. Deterministic TSDB fixtures cover retained samples.
      - name: Run Prometheus source smoke test
        run: |
          docker pull quay.io/prometheus/prometheus:v3.0.1
          python3 cmd/wpdiag/tests/prometheus_smoke.py

      - name: Run Milvus query-stage smoke test
        run: python3 cmd/wpdiag/tests/query_smoke.py

      - name: Run Jaeger source smoke test
        run: |
          docker pull jaegertracing/all-in-one:1.53.0
          python3 cmd/wpdiag/tests/jaeger_smoke.py

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
