name: Issue Command Tests

on:
  pull_request:
    branches: [master, dev]
    paths:
      - .github/scripts/issue-commands*
      - .github/workflows/issue-commands*.yaml
  push:
    branches: [master, dev]
    paths:
      - .github/scripts/issue-commands*
      - .github/workflows/issue-commands*.yaml

permissions:
  contents: read

jobs:
  test:
    name: Issue Command Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/issue-commands.test.cjs
