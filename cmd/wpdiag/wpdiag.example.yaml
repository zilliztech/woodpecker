schema_version: wpdiag.config/v1
sources:
  wpcli:
    connections:
      local:
        enabled: true
        settings:
          # A bare executable name uses PATH. Relative paths containing a path
          # separator and cli_config resolve relative to this file's directory.
          executable: wp
          context: wp-ops-v0146/milvus-stack
          # Optional: omit to let wpcli use its default ~/.woodpecker/cli.yaml.
          # An ambient WOODPECKER_CLI_CONFIG/WOODPECKER_ENDPOINT is not inherited.
          cli_config: ./cli.yaml
          native_limits:
            max_samples: 121
            max_ops: 100
            max_series: 500
            max_response_bytes: 2097152
            concurrency: 8
            timeout_ms: 30000
  # Prometheus works independently of wpcli/Admin, trace and Loki.
  prometheus:
    connections:
      local:
        enabled: true
        settings:
          endpoint: http://127.0.0.1:9090
          deployment: milvus-stack
          match_labels:
            cluster: wp-ops-v0146
            namespace: milvus-stack
            woodpecker_id: milvus-stack
          # bearer_token_env: PROMETHEUS_TOKEN
  # Optional independent Jaeger source. Enable only with reachable Query/UI.
  trace:
    connections:
      local:
        enabled: false
        settings:
          endpoint: http://127.0.0.1:16686
          deployment: milvus-stack
          services:
            proxy: proxy
            streamingnode: streamingnode
            segcore: segcore
            mixture: other
            milvus-woodpecker-0: wp_server
            milvus-woodpecker-1: wp_server
            milvus-woodpecker-2: wp_server
          search:
            service: proxy
          # request_id_tag: request_id
          # bearer_token_env: JAEGER_TOKEN
          policy:
            slow_span_ms: 1000
  # Loki is independently usable; these are the Alloy labels, not metric labels.
  loki:
    connections:
      local:
        enabled: true
        settings:
          endpoint: http://127.0.0.1:3100
          deployment: milvus-stack
          match_labels:
            cluster: wp-ops-v0146
            namespace: milvus-stack
          # bearer_token_env: LOKI_TOKEN
          # tenant_env: LOKI_TENANT
