apiVersion: batch/v1
kind: Job
metadata:
  name: quickstart-client
  namespace: wp-quickstart
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: woodpecker-quickstart-client:local
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/client.yaml"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: wp-client-config}
