# Isolated development environment. Service ports are private to this network.
name: woodpecker-quickstart
x-node: &node
  image: docker.io/milvusdb/woodpecker:v0.1.46
  profiles: [service]
  volumes:
    - ./compose-client.yaml:/config/server.yaml:ro
  environment: &node-env
    CONFIG_FILE: /config/server.yaml
    STORAGE_TYPE: service
    MINIO_ADDRESS: minio
    MINIO_PORT: "9000"
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    ETCD_ENDPOINTS: etcd:2379
    SERVICE_PORT: "18080"
    GOSSIP_PORT: "17946"
    SEEDS: wp-0:17946,wp-1:17946,wp-2:17946
    SERVICE_SEEDS: wp-0:18080,wp-1:18080,wp-2:18080
    CLUSTER_NAME: quickstart
    RESOURCE_GROUP: default
    REGION: local
    AVAILABILITY_ZONE: local
    METRICS_PORT: "9091"
  depends_on:
    etcd: {condition: service_healthy}
    minio: {condition: service_healthy}
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:9091/healthz]
    interval: 5s
    timeout: 3s
    retries: 36
    start_period: 15s
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    ports: ["127.0.0.1:12379:2379"]
    volumes: [etcd-data:/etcd]
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://localhost:2379, endpoint, health]
      interval: 5s
      timeout: 3s
      retries: 24
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    command: [minio, server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:19000:9000"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 24
  wp-0:
    <<: *node
    environment:
      <<: *node-env
      NODE_NAME: wp-0
      ADVERTISE_SERVICE_ADDR: wp-0:18080
      ADVERTISE_GOSSIP_ADDR: wp-0:17946
    volumes:
      - ./compose-client.yaml:/config/server.yaml:ro
      - wp-0-data:/woodpecker/data
  wp-1:
    <<: *node
    environment:
      <<: *node-env
      NODE_NAME: wp-1
      ADVERTISE_SERVICE_ADDR: wp-1:18080
      ADVERTISE_GOSSIP_ADDR: wp-1:17946
    volumes:
      - ./compose-client.yaml:/config/server.yaml:ro
      - wp-1-data:/woodpecker/data
  wp-2:
    <<: *node
    environment:
      <<: *node-env
      NODE_NAME: wp-2
      ADVERTISE_SERVICE_ADDR: wp-2:18080
      ADVERTISE_GOSSIP_ADDR: wp-2:17946
    volumes:
      - ./compose-client.yaml:/config/server.yaml:ro
      - wp-2-data:/woodpecker/data
  client:
    image: woodpecker-quickstart-client:local
    profiles: [tools]
    build:
      context: ../..
      dockerfile: docs/quickstart/Dockerfile
    volumes: [".:/examples:ro"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
volumes:
  etcd-data:
  minio-data:
  wp-0-data:
  wp-1-data:
  wp-2-data:
