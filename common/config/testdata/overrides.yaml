woodpecker:
  meta:
    type: etcd
    prefix: woodpecker
  client:
    segmentAppend:
      queueSize: 20000
      maxRetries: 22
    segmentRollingPolicy:
      maxSize: 22220000000
      maxInterval: 2200
      maxBlocks: 2000
    auditor:
      maxInterval: 10
    quorum:
      quorumBufferPools:
        - name: region-a-pool
          seeds: ["test-node1", "test-node2"]
        - name: region-b-pool
          seeds: ["test-node3", "test-node4", "test-node5"]
      quorumSelectStrategy:
        affinityMode: hard
        replicas: 5
        strategy: custom
        customPlacement:
          - name: replica-1
            region: "region-a-pool"
            az: "test-az-1"
            resourceGroup: "test-rg-1"
          - name: replica-2
            region: "region-a-pool"
            az: "test-az-2"
            resourceGroup: "test-rg-2"
          - name: replica-3
            region: "region-b-pool"
            az: "test-az-1"
            resourceGroup: "test-rg-3"
          - name: replica-4
            region: "region-b-pool"
            az: "test-az-2"
            resourceGroup: "test-rg-4"
          - name: replica-5
            region: "region-a-pool"
            az: "test-az-3"
            resourceGroup: "test-rg-5"
  logstore:
    segmentSyncPolicy:
      maxFlushSize: 8388608
    segmentReadPolicy:
      maxBatchSize: 32000000
      maxFetchThreads: 64
