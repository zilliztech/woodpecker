# Apply to BOTH monitoring and full-stack support via --mail-capture.
# Mailpit stores messages locally; no SMTP relay or forwarding is configured.
mailpit:
  enabled: true
alertmanager:
  config:
    route:
      routes:
        - receiver: smtp-capture
          matchers: ['alert_set="woodpecker-full-stack"']
        - receiver: smtp-capture
          matchers: ['notification_test="email"']
          group_by: [alertname, test_run]
          group_wait: 2s
          group_interval: 10s
          repeat_interval: 1h
    receivers:
      - name: local-only
      - name: smtp-capture
        email_configs:
          - to: zhenyuan.wei@zilliz.com
            from: woodpecker-alerts@example.test
            smarthost: full-stack-mailpit:1025
            require_tls: false
            send_resolved: true
