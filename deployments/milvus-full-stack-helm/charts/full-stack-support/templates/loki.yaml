{{- if .Values.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-loki
data:
  config.yaml: |
{{ include "full-stack.lokiConfig" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-loki
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-loki
spec:
  serviceName: {{ .Release.Name }}-loki
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-loki}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-loki}
      annotations:
        checksum/loki-config: {{ include "full-stack.lokiConfig" . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.loki.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/config.yaml, -target=all]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /var/loki}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-loki
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app: {{ .Release.Name }}-loki}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.loki.storage }}
{{- end }}
