syntax = "proto3";

package woodpecker.proto.checkpoint;

option go_package = "github.com/zilliztech/woodpecker/proto";

// SegmentCheckpoint is an intermediate recovery checkpoint of the durable,
// contiguous block prefix of a segment. It is a best-effort recovery hint.
// Add compatible fields without changing format_version. Reserve removed field
// numbers and names; never reuse them. A change to recovery semantics that old
// readers cannot safely ignore requires a new format_version and full-scan fallback.
message SegmentCheckpoint {
  uint32 format_version = 1;
  repeated CheckpointBlockIndex block_indexes = 2;
  // -1 for an empty checkpoint; otherwise the last indexed entry ID.
  sint64 last_entry_id = 3;
  uint64 total_size = 4;
}

// CheckpointBlockIndex describes a durable block in the gap-free prefix.
// These are typed fields rather than encoded WAL index/footer records, so
// checkpoint schema evolution is independent of the WAL record layout.
message CheckpointBlockIndex {
  int32 block_number = 1;
  int64 start_offset = 2;
  uint32 block_size = 3;
  int64 first_entry_id = 4;
  int64 last_entry_id = 5;
}
