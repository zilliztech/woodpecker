apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: woodpecker-server
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker
    app.kubernetes.io/component: server
spec:
  namespaceSelector:
    matchNames: [woodpecker]
  selector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: my-woodpecker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      honorLabels: true
      relabelings:
        # Instance identity: a namespace may host several woodpecker clusters,
        # and prometheus-operator derives `job` from this PodMonitor, so `job`
        # is the same for all of them. The helm release name is the only
        # per-cluster discriminator; production names it wp-<id>.
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
          regex: (?:wp-)?(.+)
          replacement: $1
          targetLabel: woodpecker_id
