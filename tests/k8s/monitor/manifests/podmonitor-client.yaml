apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: woodpecker-client
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker
    app.kubernetes.io/component: client
spec:
  namespaceSelector:
    matchNames: [woodpecker]
  selector:
    matchLabels:
      app.kubernetes.io/name: woodpecker
      app.kubernetes.io/component: client
      app.kubernetes.io/instance: my-woodpecker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      honorLabels: true
      relabelings:
        # Same instance identity as the server PodMonitor, so a client and the
        # cluster it writes to share one woodpecker_id value.
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
          regex: (?:wp-)?(.+)
          replacement: $1
          targetLabel: woodpecker_id
